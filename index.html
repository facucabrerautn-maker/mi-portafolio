<!doctype html>
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facu — Portafolio</title>
  <meta name="description" content="Portafolio de Facu, estudiante de programación.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <script>document.documentElement.className = 'js';</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Logo estático en esquina superior izquierda (logo + "Made by Facu") -->
  <a class="site-logo" href="#inicio" aria-label="Facu — Inicio" aria-hidden="true">
    <svg class="site-logo__svg" viewBox="0 0 1515 623" focusable="false" aria-hidden="true"></svg>
  </a>

  <!-- Pantalla de carga: el logo y el texto "made by facu" se dibujan juntos y se rellenan -->
  <div class="loader" id="loader">
    <p class="sr-only" role="status">Cargando el portafolio de Facu… Made by Facu</p>
    <div class="loader__stage" aria-hidden="true">
      <svg class="loader__logo" viewBox="0 0 1515 623" focusable="false"></svg>
    </div>
    <button class="loader__skip" type="button">Saltar intro</button>
  </div>

  <main id="inicio" tabindex="-1">

    <section class="home">
      <div class="hero">
        <h1 class="hero__title">Hola, soy Facu.</h1>
        <p class="hero__lead">Estudiante de programación.</p>
        <a class="hero__link" href="#proyectos">Ver proyectos</a>
        <p class="hero__note">Sitio en construcción</p>
      </div>
    </section>

    <!-- Proyectos: carrete 3D. Los proyectos se editan en js/projects-data.js -->
    <section class="work" id="proyectos" aria-label="Proyectos">
      <canvas class="work__canvas" id="reel" tabindex="0" role="group" aria-label="Carrete de proyectos"></canvas>
      <ul class="work__grid" id="reel-fallback" hidden></ul>
      <p class="work__hint" id="reel-hint">Arrastrá para explorar</p>
      <p class="sr-only" id="reel-live" aria-live="polite"></p>

      <!-- Botón de contacto con animación fly-through -->
      <button class="contact-btn" type="button" aria-haspopup="dialog" aria-label="Abrir opciones de contacto" aria-controls="contact-dialog">
        <span class="contact-btn__leading" aria-hidden="true">
          <svg class="contact-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </span>
        <span class="contact-btn__label">Contacto</span>
        <span class="contact-btn__trailing" aria-hidden="true">
          <svg class="contact-btn__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
        </span>
      </button>
    </section>

    <!-- Modal de contacto -->
    <dialog class="contact-dialog" id="contact-dialog" role="dialog" aria-modal="true" aria-labelledby="contact-dialog-title">
      <div class="contact-dialog__backdrop" tabindex="-1"></div>
      <div class="contact-dialog__panel">
        <header class="contact-dialog__header">
          <h3 id="contact-dialog-title" class="contact-dialog__title">Contactame</h3>
          <button class="contact-dialog__close" type="button" aria-label="Cerrar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </header>
        <ul class="contact-dialog__list" role="list">
          <li>
            <a class="contact-dialog__item" href="https://github.com/facucabrerautn-maker" target="_blank" rel="noopener noreferrer">
              <svg class="contact-dialog__item-icon" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
              <span>GitHub</span>
            </a>
          </li>
          <li>
            <a class="contact-dialog__item" href="mailto:facucabrerautn@gmail.com">
              <svg class="contact-dialog__item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              <span>Email</span>
            </a>
          </li>
          <li>
            <a class="contact-dialog__item" href="https://wa.me/5491123456789" target="_blank" rel="noopener noreferrer">
              <svg class="contact-dialog__item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
              <span>WhatsApp</span>
            </a>
          </li>
        </ul>
      </div>
    </dialog>

  </main>

  <script src="assets/logo-paths.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/projects-data.js"></script>
  <script src="js/projects-reel.js"></script>
  <script src="js/contact-dialog.js"></script>
</body>
</html>
