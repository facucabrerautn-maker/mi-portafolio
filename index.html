<!doctype html>
<html lang="es" class="no-js" data-page="home">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facundo Cabrera — Estudiante de programación | Portafolio</title>
  <meta name="description" content="Portafolio de Facundo Cabrera, estudiante de programación: proyectos web, stack tecnológico y contacto.">
  <meta name="theme-color" content="#0a0a0a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Facundo Cabrera">
  <meta property="og:title" content="Facundo Cabrera — Estudiante de programación | Portafolio">
  <meta property="og:description" content="Portafolio de Facundo Cabrera, estudiante de programación: proyectos web, stack tecnológico y contacto.">
  <meta property="og:image" content="https://facucabrerautn-maker.github.io/mi-portafolio/assets/og-image.jpg">
  <meta property="og:locale" content="es_AR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <script>document.documentElement.className = 'js';</script>
  <script src="js/layout.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <site-loader></site-loader>
  <site-header></site-header>

  <main id="inicio" tabindex="-1">

    <!-- Cielo unificado: estrellas (oscuro) / nubes (claro) — js/sky.js -->
    <canvas class="site-sky" id="sky" aria-hidden="true"></canvas>

    <section class="home" aria-labelledby="titulo-inicio">

      <h1 class="sr-only" id="titulo-inicio">Facundo Cabrera — Estudiante de programación</h1>

      <div class="home__content">
        <div class="home__ornament" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 0c.7 6.4 4.6 10.3 12 12-7.4 1.7-11.3 5.6-12 12-.7-6.4-4.6-10.3-12-12C7.4 10.3 11.3 6.4 12 0z"/></svg>
        </div>
        <p class="home__message" data-i18n="home.message">Si tenés una idea en mente o querés que <em>trabajemos juntos</em>, me encantará escucharte.</p>
      </div>

      <!-- Personaje acostado en una isla flotante: recorte con transparencia, abajo a la derecha -->
      <figure class="home__character">
        <img src="assets/personaje-acostado.webp" width="1400" height="788" decoding="async"
             alt="Ilustración 3D de Facu acostado sobre una isla flotante de pasto, con anteojos y remera negra, mirando el cielo">
      </figure>
    </section>

    <!-- Proyectos: carrete 3D. Los proyectos se editan en js/projects-data.js -->
    <section class="work" id="proyectos" data-i18n-label="nav.projects" aria-label="Proyectos">
      <canvas class="work__canvas" id="reel" tabindex="0" role="group" data-i18n-label="a11y.reel" aria-label="Carrete de proyectos"></canvas>
      <ul class="work__grid" id="reel-fallback" hidden></ul>
      <p class="work__hint" id="reel-hint" data-i18n="home.hint">Arrastrá para explorar</p>
      <p class="sr-only" id="reel-live" aria-live="polite"></p>
    </section>

    <site-footer></site-footer>

  </main>

  <script src="js/i18n.js"></script>
  <script src="assets/logo-paths.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/projects-data.js"></script>
  <script src="js/projects-reel.js"></script>
  <script src="js/site-header.js"></script>
</body>
</html>
