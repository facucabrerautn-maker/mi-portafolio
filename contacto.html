<!doctype html>
<html lang="es" class="no-js">
<head>

  <link rel="stylesheet" href="css/styles.css">

<body>

  <!-- Pantalla de carga -->
  <div class="loader" id="loader">
    <p class="sr-only" role="status">Cargando… Made by Facu</p>

    <button class="loader__skip" type="button">Saltar intro</button>
  </div>

  <!-- Cabecera fija -->
  <header class="site-header" id="site-header" role="banner">
    <div class="site-header__inner">
      <a class="site-header__brand" href="index.html" aria-label="Facu — Inicio">
        <svg class="site-header__logo" viewBox="0 0 1515 623" focusable="false" aria-hidden="true"></svg>
      </a>

      <nav class="site-header__nav" aria-label="Navegación principal">
        <ul class="site-header__list" role="list">
          <li><a class="site-header__link" href="index.html#proyectos" data-i18n="nav.projects">Proyectos</a></li>

          <li><a class="site-header__link" href="stack.html" data-i18n="nav.stack">Stack</a></li>

          <svg class="site-header__icon site-header__icon--sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">

            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

          </svg>

        <button class="site-header__btn site-header__btn--lang" type="button" aria-label="Cambiar idioma" aria-pressed="false" data-lang-btn>
          <span class="site-header__lang-text" data-i18n="lang.current">ES</span>
          <svg class="site-header__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
        </button>
      </div>
    </div>

  <main id="contacto" tabindex="-1">

    <canvas class="site-sky" id="sky" aria-hidden="true"></canvas>

    <!-- Contacto -->
    <section class="contact-page" aria-labelledby="contact-title">
      <div class="contact-page__inner">
        <header class="contact-page__header">
          <h1 id="contact-title" class="contact-page__title" data-i18n="contact.title">Contacto</h1>
          <p class="contact-page__subtitle" data-i18n="contact.subtitle">¿Tienes un proyecto en mente? Me encantaría escucharte</p>
        </header>
        <div class="contact-page__links" role="list" aria-label="Métodos de contacto">
          <!-- Se llena dinámicamente desde js/contact-dialog.js -->
        </div>
      </div>
    </section>

  </main>

  <script src="assets/logo-paths.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/starfield.js"></script>
