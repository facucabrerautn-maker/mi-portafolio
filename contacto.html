<!doctype html>
<html lang="es" class="no-js" data-page="contact">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto — Facundo Cabrera</title>
  <meta name="description" content="Contactá a Facundo Cabrera: GitHub, email y WhatsApp.">
  <meta name="theme-color" content="#0a0a0a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Facundo Cabrera">
  <meta property="og:title" content="Contacto — Facundo Cabrera">
  <meta property="og:description" content="Contactá a Facundo Cabrera: GitHub, email y WhatsApp.">
  <meta property="og:image" content="https://facucabrerautn-maker.github.io/mi-portafolio/assets/og-image.jpg">
  <meta property="og:locale" content="es_AR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <script>document.documentElement.className = 'js';</script>
  <script src="js/layout.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <site-loader></site-loader>
  <site-header></site-header>

  <main id="contacto" tabindex="-1">

    <!-- Cielo unificado: estrellas (oscuro) / nubes (claro) — js/sky.js -->
    <canvas class="site-sky" id="sky" aria-hidden="true"></canvas>

    <!-- Contacto -->
    <section class="contact-page" aria-labelledby="contact-title">
      <div class="contact-page__inner">
        <h1 class="sr-only" id="contact-title" data-i18n="contact.title">Contacto</h1>
        <div class="contact-page__layout">
          <!-- Lado izquierdo: placeholder CV -->
          <div class="contact-page__cv-placeholder" aria-hidden="true">
            <div class="contact-page__cv-image">
              <!-- Aquí irá el PNG del CV -->
            </div>
            <span class="contact-page__cv-label" data-i18n="contact.cvLabel">CV / Curriculum</span>
          </div>

          <!-- Lado derecho: cápsulas de contacto en pila -->
          <div class="contact-page__actions" data-i18n-label="a11y.contactMethods" aria-label="Métodos de contacto">
            <div class="contact-page__links">
              <!-- Se llena dinámicamente desde js/contact-page.js -->
            </div>
            <!-- Cápsula extra: Descargar CV (placeholder) -->
            <a class="contact-page__link contact-page__link--cv" href="#" data-i18n-label="contact.downloadCv" aria-label="Descargar CV">
              <span class="contact-page__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </span>
              <span class="contact-page__text" data-i18n="contact.downloadCv">Descargar CV</span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <site-footer></site-footer>

  </main>

  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="assets/logo-paths.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/contact-page.js"></script>
  <script src="js/site-header.js"></script>
</body>
</html>
